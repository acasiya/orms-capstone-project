<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Arial, Helvetica, sans-serif;color:#2b2b2b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e2ddd0;max-width:480px;">
          <tr>
            <td style="background:#16223f;padding:20px 28px;">
              <span style="color:#ffffff;font-size:18px;font-weight:bold;letter-spacing:0.5px;">O.R.M.S.</span><br />
              <span style="color:#c7cde0;font-size:12px;">Barangay Platero &mdash; Ordinance Reporting and Management System</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f7f5ef;border-top:1px solid #e2ddd0;">
              <span style="color:#8a8578;font-size:11px;">This is an automated message from O.R.M.S. Please do not reply to this email.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
