<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/staff/vendor/leaflet/leaflet.css">
<style>html,body,#m{margin:0;width:791px;height:660px}</style></head><body><div id="m"></div>
<script src="/staff/vendor/leaflet/leaflet.js"></script>
<script>
const q=new URLSearchParams(location.search);
const map=L.map('m',{zoomSnap:0,zoomControl:false,attributionControl:false}).setView([+q.get('lat'),+q.get('lng')],+q.get('z'));
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
window.map=map;
if(q.get('px')){ // pixel polygon -> latlng, drawn
  const px=JSON.parse(q.get('px'));
  const ll=px.map(p=>map.containerPointToLatLng(p));
  L.polygon(ll,{color:'red',weight:2,dashArray:'3 4',fill:false}).addTo(map);
  window.ll=ll.map(p=>[+p.lat.toFixed(6),+p.lng.toFixed(6)]);
}
</script></body></html>
