<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeSpace — Ordinances</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <span class="admin-sidebar__logo" aria-hidden="true"></span>
        <div class="admin-sidebar__brand-text">
          <strong>SafeSpace</strong>
          <small>Barangay Platero</small>
          <small>Barangay Staff Portal</small>
        </div>
      </div>
      <ul class="admin-sidebar__nav">
        <li><a href="reports-dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20V12M10 20V5M15.5 20v-8.5M21 20H3"/></svg> Reports Dashboard</a></li>
        <li><a href="reports.html"><svg class="nav-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h6.5L18 7.5V20a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M13.5 3v4.5H18"/><path d="M8.5 12.5h7M8.5 16h7M8.5 9h3"/></svg> Reports</a></li>
        <li><a href="concerns-dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12c0-4.4 3.9-8 8.5-8s8.5 3.6 8.5 8-3.9 8-8.5 8a10 10 0 01-2.9-.4L4 21l1.1-3.8A7.6 7.6 0 013.5 12z"/></svg> Concerns/Suggestions Dashboard</a></li>
        <li><a href="concerns.html"><svg class="nav-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5H5.5a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2V12"/><path d="M18.4 3.6a2.1 2.1 0 013 3L11 17l-4 1 1-4z"/></svg> Concerns/Suggestions</a></li>
        <li><a href="ordinances.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4 4.5 4v14c3.5 0 6 1 7.5 2.5"/><path d="M12 6.5C13.5 5 16 4 19.5 4v14c-3.5 0-6 1-7.5 2.5V6.5z"/></svg> Ordinance</a></li>
      </ul>
      <button type="button" class="admin-sidebar__logout" id="logoutBtn">&#8618; Logout</button>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="admin-topbar__menu-btn" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
        <div class="admin-topbar__profile">
          <span class="navbar__bell" role="button" tabindex="0" id="notifBell">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a5 5 0 00-5 5v3.5c0 .8-.3 1.6-.9 2.2L5 16h14l-1.1-1.3a3.2 3.2 0 01-.9-2.2V9a5 5 0 00-5-5z"/><path d="M10 19a2.2 2.2 0 004 0"/></svg><span class="navbar__badge" id="notifBadge" hidden></span>
            <div class="notif-dropdown" id="notifDropdown" hidden>
              <div class="notif-dropdown__header">
                <h3 class="notif-dropdown__title">Notifications</h3>
                <button type="button" class="notif-dropdown__clear-all" id="notifClearAll">Clear All</button>
              </div>
              <ul class="notif-dropdown__list" id="notifList"></ul>
            </div>
          </span>
          <button type="button" class="admin-topbar__profile-btn" id="profileBtn">
            <span class="admin-topbar__avatar" aria-hidden="true"></span>
            <span class="admin-topbar__name">
              <strong>Eliseo Aurelio Jr.</strong>
              <small>Barangay Chairman</small>
            </span>
          </button>
        </div>
      </header>

      <div class="admin-content">
        <div class="page-shell page-shell--nested">
          <div class="ordinances-toolbar">
            <select id="sortField" class="sort-select">
              <option value="none">- All -</option>
              <option value="title" selected>Title</option>
              <option value="author">Author</option>
              <option value="numberSort">No.</option>
              <option value="dateSort">Date Approved</option>
            </select>
            <form class="ordinances-search" id="ordinanceSearchForm">
              <input type="text" id="ordinanceSearch" placeholder="Search..." />
              <button type="submit">Search</button>
            </form>
            <button type="button" class="btn" id="uploadOrdinanceBtn">+ Upload Ordinance</button>
          </div>

          <div class="ordinances-table-wrap">
            <table class="ordinances-table">
              <thead>
                <tr>
                  <th>Ordinance Name</th>
                  <th>Author</th>
                  <th>Ordinance No.</th>
                  <th>Date Approved</th>
                </tr>
              </thead>
              <tbody id="ordinanceRows"></tbody>
            </table>
          </div>

          <div class="pagination-bar">
            <span id="paginationInfo"></span>
            <div class="pagination-controls">
              <button type="button" id="paginationPrev" aria-label="Previous page">&#8249;</button>
              <button type="button" id="paginationNext" aria-label="Next page">&#8250;</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/ordinances-data.js"></script>
  <script src="js/ordinances-list.js"></script>
  <script src="js/admin.js"></script>

  <!-- Upload ordinance -->
  <div class="modal-overlay" id="uploadOrdinanceModal" hidden>
    <div class="modal-card">
      <h2>Upload Ordinance</h2>
      <div class="field">
        <label for="ordNumberInput">Ordinance No.</label>
        <input type="text" id="ordNumberInput" placeholder="e.g. No. 31-(2026)" />
      </div>
      <div class="field">
        <label for="ordTitleInput">Title</label>
        <input type="text" id="ordTitleInput" placeholder="Ordinance title" />
      </div>
      <div class="field">
        <label for="ordAuthorInput">Authored by</label>
        <input type="text" id="ordAuthorInput" placeholder="e.g. Hon. Juan Dela Cruz" />
      </div>
      <div class="field">
        <label for="ordCategoryInput">Category</label>
        <input type="text" id="ordCategoryInput" placeholder="e.g. Public Safety" />
      </div>
      <div class="field">
        <label for="ordDateInput">Date Approved</label>
        <input type="date" id="ordDateInput" />
      </div>
      <div class="field">
        <label for="ordDescriptionInput">Description</label>
        <textarea id="ordDescriptionInput" placeholder="Full ordinance text/summary..."></textarea>
      </div>
      <div class="field">
        <label class="upload-drop upload-drop--compact" for="ordPdfInput" id="ordPdfLabel">
          <span class="upload-drop__icon">&#11014;&#65039;</span>
          <span class="upload-drop__text" id="ordPdfLabelText">Click to browse for the ordinance PDF</span>
          <span class="upload-drop__formats">PDF only.</span>
        </label>
        <input type="file" id="ordPdfInput" accept="application/pdf" hidden />
      </div>
      <p class="form-error" id="uploadOrdinanceError" hidden></p>
      <div class="btn-row">
        <button type="button" class="btn" id="uploadOrdinanceConfirm">Upload</button>
        <button type="button" class="btn btn-danger" id="uploadOrdinanceCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Profile popup -->
  <div class="modal-overlay" id="profileModal" hidden>
    <div class="modal-card profile-card">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
      <div class="profile-card__row">
        <span class="profile-avatar" id="profileCardInitials"></span>
        <div>
          <p class="profile-card__name" id="profileCardName"></p>
          <p class="profile-card__role" id="profileCardRole"></p>
        </div>
      </div>
      <a class="btn btn-muted" href="profile.html">Edit Information</a>
      <button type="button" class="btn btn-muted" id="profileLogoutBtn">Log Out</button>
    </div>
  </div>

  <!-- Logout confirmation -->
  <div class="modal-overlay" id="logoutConfirmModal" hidden>
    <div class="modal-card">
      <h2>Continue to Logout?</h2>
      <div class="btn-row">
        <button type="button" class="btn" id="logoutYes">Yes</button>
        <button type="button" class="btn btn-danger" id="logoutNo">No</button>
      </div>
    </div>
  </div>
</body>
</html>
